# ============================================================
# TBI RNA-seq Pipeline Configuration
# Mouse mm39 (GRCm39) | Paired-end | PBS/SGE cluster
# ============================================================
# Edit every path prefixed with /path/to/ before running.

# ------- Reference files (mm39 / GRCm39 + GENCODE vM35) ----
genome:
  fasta:      /path/to/refs/mm39/GRCm39.primary_assembly.genome.fa
  gtf:        /path/to/refs/mm39/gencode.vM35.annotation.gtf
  star_index: /path/to/refs/mm39/star_index_150bp   # built by scripts/star_genome_index.sh

# ------- Input data -----------------------------------------
samples:   config/samples.tsv
fastq_dir: /path/to/raw_fastq      # directory containing all raw .fastq.gz files

# ------- Output directory -----------------------------------
results_dir: results

# ------- Trimming (Trimmomatic) -----------------------------
trimming:
  # Adapter file – path inside the trimmomatic conda env, or supply your own
  adapter:       /path/to/conda/envs/tbi-qc/share/trimmomatic/adapters/TruSeq3-PE-2.fa
  leading:       3
  trailing:      3
  slidingwindow: "4:15"
  minlen:        36

# ------- STAR alignment -------------------------------------
star:
  threads:     8
  overhang:    149      # read_length - 1  (adjust if not 150 bp reads)
  genome_load: NoSharedMemory
  extra_flags: >-
    --outSAMtype BAM SortedByCoordinate
    --outSAMattributes NH HI AS NM MD
    --outFilterMultimapNmax 10
    --outFilterMismatchNmax 8
    --alignSJoverhangMin 8
    --alignSJDBoverhangMin 1
    --alignIntronMin 20
    --alignIntronMax 1000000
    --twopassMode Basic

# ------- featureCounts (Subread) ----------------------------
featurecounts:
  threads:             4
  strandedness:        2     # 0 = unstranded | 1 = sense | 2 = antisense
                             # Verify with: RSeQC infer_experiment.py
  min_mapping_quality: 10
  feature_type:        exon
  attribute_type:      gene_id

# ------- DESeq2 / R analysis --------------------------------
analysis:
  fdr_threshold: 0.05
  lfc_threshold: 1.0    # |log2FC| used for labelling/filtering DEGs
  min_counts:    10     # minimum summed counts across all samples to retain a gene
  batch_col:     batch

  # Each entry: [numerator, denominator, output_label]
  contrasts:
    treatment:
      - ["TBI",     "SHAM",    "TBI_vs_SHAM"]
      - ["TBI.EGT", "TBI",     "EGT_vs_TBI"]
      - ["TBI.EGT", "SHAM",    "EGT_vs_SHAM"]
    region:
      - ["Ips", "Con", "Ips_vs_Con"]
    pmi:
      - ["24h", "8h", "PMI_24h_vs_8h"]
    sex:
      - ["Male", "Female", "Male_vs_Female"]
    genotype:
      - ["KO", "WT", "KO_vs_WT"]

# ------- Pathway enrichment ---------------------------------
pathway:
  species:          "Mus musculus"
  orgdb:            "org.Mm.eg.db"
  kegg_organism:    "mmu"
  msigdb_collections: ["H", "C2", "C5", "C7"]  # Hallmarks, Curated, GO, Immunological
  fdr_cutoff:       0.05
  min_geneset_size: 10
  max_geneset_size: 500

# ------- WGCNA ----------------------------------------------
wgcna:
  min_module_size: 30
  merge_cut_height: 0.25
  soft_power: null     # null = auto-select via pickSoftThreshold; or set integer
  block_size: 5000     # genes per block for blockwiseModules (memory control)
